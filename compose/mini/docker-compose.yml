services:
  mysql8.2:
    image: mysql:8.2.0
    healthcheck:
      test: mysqladmin ping -p${MYSQL_ROOT_PASSWORD}
    container_name: mini-mysql
    restart: always
    networks:
      - mini-svc
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql8.2/logs:/var/log/mysql
      # - ./mysql8.2/conf/my.cnf:/etc/mysql/conf.d/my.cnf:rw
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - "LANG=C.UTF-8"
      - TZ=Asia/Shanghai

  redis:
    image: redis:5.0
    restart: always
    container_name: mini-redis
    networks:
      - mini-svc
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data:rw
      - ./redis5.0:/usr/local/etc/redis:rw
    environment:
      - "LANG=C.UTF-8"
      - TZ=Asia/Shanghai
    
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - 27017:27017
    networks:
      - mini-svc
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:123456@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: 123456
    networks:
      - mini-svc
    depends_on:
      - mongo


networks:
  mini-svc:

volumes:
  mysql-data:
  redis-data:
  mongo-data: